version: '3.8'

services:
  learn_nest_api_chat_app_b01-dev-db:
    container_name: l_nest_chat_app_b01-dev-db_container
    image: postgres:16
    restart: always
    ports:
      - 5434:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=learn_nest_api_chat_app_b01
    volumes:
      - l_nest_api_chat_app_b01-dev-db-data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - 6740:6739

volumes:
  l_nest_api_chat_app_b01-dev-db-data: